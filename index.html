function updateProgress(){if($('#elapsed'))$('#elapsed').textContent=Math.floor(state.pos/60)+':'+String(state.pos%60).padStart(2,'0');if($('#progress'))$('#progress').value=state.pos;if($('#timerLabel'))$('#timerLabel').textContent=state.timer?'将在 '+Math.max(0,Math.ceil((state.timer-Date.now())/60000))+' 分钟后暂停':'定时关闭：未设置'}function favorite(){let i=state.favs.indexOf(state.item);i<0?state.favs.push(state.item):state.favs.splice(i,1);save();render()}function modal(html){$('#modal').innerHTML=html+'<p id="dialogError" class="dialog-error" role="alert"></p>'+btn('关闭',"$('#modal').close()");if(!$('#modal').open)$('#modal').showModal()}function timerDialog(){modal('<h2>定时关闭</h2><p>到时自动暂停播放演示</p>'+[1,15,30,60].map(n=>btn(n+' 分钟',`setTimer(${n})`)).join('')+'<label>自定义分钟（1–180）<input id="minutes" type="number" min="1" max="180" placeholder="例如 20"></label>'+btn('确认',"setTimer(Number($('#minutes').value))",'primary')+btn('取消定时',"state.timer=0;$('#modal').close();render()"))}function setTimer(n){if(!Number.isInteger(n)||n<1||n>180)return toast('请输入 1–180 的整数分钟');state.timer=Date.now()+n*60000;$('#modal').close();render();toast('已设置定时关闭')}function purchase(){if(state.page!=='member'||state.busy||state.member)return;if(!['month','year'].includes(state.plan))return toast('请先选择月度或年度套餐');state.busy=true;state.until=Date.now()+(state.plan==='month'?30:365)*86400000;state.member=true;save();state.busy=false;state.page='success';render();window.scrollTo(0,0)}function finishPurchase(){if(state.page!=='success')return;if(state.origin==='player'&&tracks[state.pending]){state.item=state.pending;state.pending=null;state.pos=0;state.playing=true;state.lastTick=Date.now();state.page='player';render();window.scrollTo(0,0)}else{go(state.origin==='report'?'report':'home')}}function journal(){modal('<h2>晨间感受</h2><p>本次演示不会修改示例统计。</p>'+['精神不错','平平稳稳','还想休息'].map(x=>btn(x,`$('#modal').close();toast('本次体验选择：${x}（未保存）')`)).join(''))}function resetDialog(){modal('<h2>重置原型？</h2><p>清除本机会员与收藏，重新体验付费流程。</p>'+btn('确认重置',"state.until=0;state.member=false;state.favs=[];state.playing=false;state.pos=0;state.timer=0;state.plan=null;state.pending=null;state.goal='放下杂念';pageHistory=[];save();$('#modal').close();go('home')",'primary'))}function tick(){const now=Date.now();if(state.member&&state.until<=now){syncMembership();render();toast('演示会员已到期，免费内容仍可使用')}if(state.timer&&now>=state.timer){state.timer=0;state.playing=false;render();toast('定时结束，已暂停')}if(state.playing){const seconds=Math.floor((now-state.lastTick)/1000);if(seconds>0){state.lastTick+=seconds*1000;state.pos=Math.min(tracks[state.item][2]*60,state.pos+seconds);if(state.pos>=tracks[state.item][2]*60){state.playing=false;render()}}}else state.lastTick=now;updateProgress()}
setInterval(tick,1000);document.addEventListener('visibilitychange',tick);render();
</script></html>
